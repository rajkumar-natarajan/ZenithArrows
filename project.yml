name: ZenithArrows
options:
  bundleIdPrefix: com.zenith
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  SWIFT_VERSION: "5.10"
  TARGETED_DEVICE_FAMILY: "1,2"        # iPhone + iPad
  SWIFT_STRICT_CONCURRENCY: targeted
  ENABLE_PREVIEWS: YES

targets:
  ZenithArrows:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ZenithArrows
        excludes:
          - "**/*.md"
    resources:
      - path: ZenithArrows/Resources
    info:
      path: ZenithArrows/Info.plist
      properties:
        CFBundleDisplayName: ZenithArrows
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        NSUserTrackingUsageDescription: "We use local analytics to improve level difficulty. No data is sold."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: ZenithArrows/ZenithArrows.entitlements
      properties:
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenith.ZenithArrows
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"    # debug builds stay fast
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - sdk: SpriteKit.framework
      - sdk: GameKit.framework
      - sdk: CoreHaptics.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
